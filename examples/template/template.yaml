apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: example-nodejs-template
  title: Example Node.js Service
  description: Create a simple Node.js service
  tags:
    - nodejs
    - service
spec:
  owner: guest
  type: service
  parameters:
    - title: Service details
      required:
        - name
      properties:
        name:
          type: string
          title: Name
          description: Name of the service
  steps:
    - id: fetch
      name: Fetch Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./
        values:
          name: ${{ parameters.name }}
  output:
    links:
      - title: Source
        url: ./
